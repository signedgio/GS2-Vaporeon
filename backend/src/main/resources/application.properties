spring.application.name=vaporeon-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/estacao
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Limites usados para gerar alertas de falha automaticamente
vaporeon.limites.nivel-minimo=20
vaporeon.limites.nivel-maximo=95
vaporeon.limites.vazao-maxima=120
vaporeon.limites.consumo-maximo=5.0